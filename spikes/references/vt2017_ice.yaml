# Roadmap 053: the reference for `ice`, from the raw data (spikes/ice_curve.py).
#
# Schleinin, Savitski, Jimenez, Sandu, Ivanov (2017), "Dataset of tyre tests on ice", Parts
# 1-3, Zenodo, doi 10.5281/zenodo.1009017 (and records 1009023, 1009025), CC BY 4.0: Virginia
# Tech's Terramechanics Rig, one passenger tire (not named in the records) on an ice lane, slip
# pinned in four steps per run, braking and driving, three repeats; 1.5/2.5/3.5 bar,
# 3.5/5/6.5 kN; and at 2.5 bar and 5 kN under a water film (`WF`) at five conditions labelled
# t-4, t-2, t0, t2, t4 (the readme does not say; a temperature in deg C is likely). The
# wheel turns at about 9.5 deg/s: the rig is slow (about 0.05 m/s), so speed effects are not
# in it. Friction coefficient Fx/Fz per nominal slip, the mean of braking and driving
# (braking alone a little higher under the film: 0.15 against 0.10 at the peak).
