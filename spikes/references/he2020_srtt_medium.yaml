# Roadmap 053 step 2: the reference for `sand`. Read off the plots by eye at 250 dpi, about
# +-0.5 % DPC and +-1 mm; nothing here was published as numbers.
#
# He, R. (2020), "Systematic Tire Testing and Model Parameterization for Tire Traction on Soft
# Soil", PhD dissertation, Virginia Tech, http://hdl.handle.net/10919/104386 (open).
# The lab dynamic tire-soil tests of 2019 on the Terramechanics Rig: the ASTM Standard
# Reference Test Tire, a Uniroyal 225/60R16 97S, at 5 kN and 42 psi (290 kPa, a Model 3's),
# rolling radius 0.3395 m, on the same dry loamy sand as he2020_srtt_low after two trips of
# the roller (medium initial compaction: cone index 601 kPa, VWC 1.2 %), the carriage at
# 6 cm/s, slip pinned per run, up to 30 %.
name: He 2020, SRTT 225/60R16 at 5 kN and 42 psi on dry loamy sand, medium compaction
tire: {radius: 0.3395, width: 0.225, load: 5000.0}
# Fig. 4.42b, 42 psi: the drawbar pull coefficient against the actual slip (zero: towed).
dpc:
  - [0.0, -0.045]
  - [0.02, 0.040]
  - [0.04, 0.108]
  - [0.08, 0.210]
  - [0.12, 0.220]
  - [0.16, 0.190]
  - [0.20, 0.173]
  - [0.30, 0.170]
# Fig. 4.45a, 42 psi: the tire's sinkage (m), measured in the tire (WITS), not the rut.
sinkage:
  - [0.02, 0.017]
  - [0.04, 0.017]
  - [0.08, 0.0195]
  - [0.12, 0.023]
  - [0.16, 0.031]
  - [0.20, 0.0365]
  - [0.30, 0.051]
# Table 5.8, medium compaction (the units as in he2020_srtt_low): k_c 106.41, k_phi 3.52,
# n 0.3053. Recorded, not used.
bekker_tire: {k_c: 106410.0, k_phi: 3520.0, n: 0.3053, width: 0.176}
