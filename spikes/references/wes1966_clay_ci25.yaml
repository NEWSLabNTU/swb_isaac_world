# Roadmap 053/054: a measured reference for `mud_wet`, the soft condition: CI 24-25 (about
# 170 kPa), 890 lb (3.96 kN), 15 % deflection, first pass.
#
# Wismer, R. D. (1966), "Performance of Soils Under Tire Loads, Report 3: Tests in Clay
# Through November 1962", Technical Report No. 3-666, U.S. Army Engineer Waterways Experiment
# Station (WES), Vicksburg, Mississippi, February 1966. Public domain; scanned at
# https://upload.wikimedia.org/wikipedia/commons/0/0f/Performance_of_soils_under_tire_loads-_Report_3-_Tests_in_clay_through_November_1962_-_USACE-p266001coll1-3149.pdf
# (local copy data/terramechanics/wes_tr3-666_report3_clay.pdf; the page numbers below are the
# PDF's).
# A single 9.00-14 2-PR smooth (treadless) bias tire in a soil bin of extremely nonsensitive fat
# clay at 90-100 % saturation (mean 95 %), compacted with a rubber-tired roller: a
# load-independent, frictionless (phi ~ 0) soil. Cone index (CI) is the WES cone index, psi on
# the cone's base area (1 psi = 6.895 kPa); tests before C124 used a 1 sq in cone, later ones the
# standard 0.5 sq in cone, which reads about 5 % higher; the report treats them as equal (para
# 22). CI here is the average 0- to 6-in. layer, first pass (Table 2, and W/CI in Tables 3-6).
# FIRST PASS ONLY, 15 % tire deflection, 890 lb nominal. Table 1 (p. 37), 890 lb at 15 %:
# tire 8A-1503 (tests C7-C112) 40.2 psi, rolling radius 1.081 ft, unloaded section width
# 8.82 in, contact pressure 36.78 psi; tire 9A-1503 (C115-C152) 41.6 psi, 1.091 ft, 8.80 in,
# 38.80 psi. Tests after C152 have no Table 1 row (doubtful which tire). 40-42 psi at 3.96 kN
# is close to a Model 3's 42 psi at ~4.4 kN; the tire is a 1960s bias ply, narrower (224 mm)
# and slicker than a passenger radial.
# How the points were read: typed table values, checked digit by digit against 300 dpi renders
# (Table 3 towed, p. 43; Table 4 constant slip, p. 47; Table 5 20 % slip, p. 48; Table 6
# self-propelled, p. 52; Table 2 soil, pp. 39-42), not the OCR. CI = W / (W/CI) of each row.
# The pull coefficient is P/W, the pull at the axle over the load; the towed rows (Table 3,
# "all pulls negative") are -Pt/W and sit at slip 0 here as in he2020, their measured slip in
# the comments. The self-propelled point (Table 6) is the slip at P = 0. No plate gives a
# pull-slip curve at a stated CI and load: Fig. 3 (p. 27) is a "typical" curve on an arbitrary
# scale (towed at about -2 % slip, self-propelled near +2 %, a knee near 10 %, still rising at
# 90 %; no maximum except "possibly at a very high slip", para 36), so only 0, the
# self-propelled slip and 20 % were measured as numbers. The faired curves of Plates 7, 10, 13
# and 15 (15 % deflection, 890-lb curve) are quoted as a cross-check, read by pixel at 300 dpi,
# about +-0.02 P/W, +-5 lb, +-0.1 in.
# Sinkage (para 28) is computed from the hub movement for the point of the tire directly below
# the axle: the tire's sinkage, not the rut, and up to 1/4 in. below the true maximum when
# large. Speed: the standard test speed is not stated in Report 3 (Report 1 has it); Plate 17's
# lowest speed, about 0.5 fps (0.15 m/s), is presumably it (doubtful). Per Plates 17-18, at our
# rig's 1 m/s (3.3 fps) the towed force and towed sinkage would be some 15-25 % lower and the
# pull at 20 % slip some 15-20 % higher than these.
#
# Tests (all 890 lb nominal, 15 %, first pass): C62 (towed, CI 25), C68 (programed slip,
# CI 24), C149 (programed slip, CI 25). C62 and C68 are "initial" tests (before C113, when
# over-sprinkling could wet the surface, paras 12-18), C149 a "later" one. Soil, Table 2,
# 0-1 / 0-6 / 6-12 in. moisture, % dry weight: C62 46.9 / 45.4 / 46.3, C68 43.5 / 44.0 / 43.2,
# C149 44.1 / 43.2 / -- (0-1/4 in. 42.2); dry density 74.0-76.7 pcf; CI 6-12 in. 26, 31, 23.
# Tire: C62/C68 on 8A-1503, C149 on 9A-1503; radius the mean of their rolling radii.
# Not used: C78 (towed, CI 27: -0.209, 1.73 in.), C151 (CI 17, wes1966_clay_ci17). At 455 lb,
# same deflection, the constant-slip C98 (CI 22, 17.6 psi) gave P/W 0.032 at 7.0 % and 0.149
# at 19.7 % slip, sinkage 0.81 / 0.87 in.
name: Wismer 1966 (WES TR 3-666 R3), 9.00-14 2-PR smooth at 890 lb and 40 psi on wet fat clay, CI 25
tire: {radius: 0.331, width: 0.224, load: 3959.0}
# P/W against slip.
#  0.0:   towed, mean of C62 -0.226 (slip -2.2 %), C68 -0.197 (0.0 %), C149 -0.205 (-0.9 %);
#         scatter -0.197 to -0.226. Plate 7 faired at CI 25: about 166 lb, -0.19.
#  0.128: self-propelled (P = 0), Table 6: C68 11.9 %, C149 13.7 %.
#  0.20:  Table 5: C68 0.053 (20.3 %), C149 0.051 (20.0 %). Plate 13 faired at CI 25: about
#         0.03 (the curve runs just under both points).
dpc:
  - [0.0, -0.209]
  - [0.128, 0.0]
  - [0.20, 0.052]
# Sinkage (m): towed C62 1.72, C68 1.81, C149 1.46 in. (mean 1.66 in.; Plate 10 faired
# 1.65 in.); self-propelled C68 1.81, C149 1.68 in.; at 20 % C68 2.02, C149 1.82 in. (Plate 15
# faired 1.95 in.).
sinkage:
  - [0.0, 0.0422]
  - [0.128, 0.0443]
  - [0.20, 0.0488]
