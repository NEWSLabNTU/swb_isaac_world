# Surface classes for the surface layer (roadmap 047; docs/design/off-road-surfaces.md).
# A map's surfaces.yaml names these by key; `classes:` there may point at another table.
#
# Per class:
#   mu     peak tire-road friction, dry. Written to a wheel relative to `reference`'s:
#          on dry `reference` a wheel keeps the rig's own tire_friction, so a map whose roads
#          are all asphalt drives exactly as one with no surface map.
#   wet    friction factor per OpenSCENARIO wetness (dry is 1.0); a missing level takes the
#          next drier one's.
#   The tire's curve on this ground (roadmap 054 T1; docs/roadmap/054, "T1 in detail"):
#   peak_slip        longitudinal slip at the peak; absent: the rig's tire's own (about 0.24
#                    at friction 1.0, proportional to the friction)
#   peak_slip_angle  deg, the slip angle at the peak; absent: the rig's (about 8.6 deg at
#                    friction 1.0, proportional to it). The server scales each wheel's tire
#                    stiffness so PhysX's tire peaks at these.
#   sliding   friction past the peak, sliding, as a share of the peak (default 1: no drop);
#             reached as sliding + (1 - sliding) / rho, rho the combined slip over the peak's
#   relaxation  m of travel the drop past the peak lags by (default 0)
#   stribeck  optional {speed: m/s, sliding: share}: the sliding share falls toward this one
#             as the sliding speed passes `speed`
#   Engineered from the literature's ranges and BeamNG's mud (0.55 to 0.35), not measured.
#   hydroplaning  true where standing water lifts the tire (paved, impermeable); loose and
#          soft ground soaks it instead.
#   soil   Bekker-Wong-Janosi parameters, for a soil zone of this class (047 S3,
#          swb_isaac_world.soil): n, k_c N/m^(n+1), k_phi N/m^(n+2), cohesion Pa, friction_angle
#          deg, janosi_k m; elastic_k Pa/m, slip_sinkage (Lyasko's slip sinkage to this
#          power, default 1; at the tire's own slip, PhysX's, docs/issues/010), unit_weight
#          N/m^3 (the soil's bulk weight, for the pressure on a sunk tire's side, 054 T2;
#          default 16000), rolling_resistance (resistance beyond the rigid wheel's
#          compaction, a share of the load: a tire flexing in soft ground; default 0, 053)
#          and slip_sinkage_until (the slip past which slip sinkage grows no more: where its
#          measurement ended; default 0.95, 053) optional. A class without them cannot be a soil zone's.
#   calibration  for a soil class, required: the measurements its soil row was fitted to
#          (roadmap 053, spikes/fit_reference.py against spikes/references/), or where the
#          row comes from and why nothing measured backs it yet. Dirt's, mud's and snow's
#          rows are Wong's (Theory of Ground Vehicles, Table 2.3, the Land Locomotion Lab's
#          measurements; Janosi K from its typical ranges), dirt's Janosi K and slip sinkage
#          fitted to Chrono's SCM (047 S5, spikes/crm_calibrate.py).
#   unvalidated  why the class's soil parameters are a stand-in, not a measurement of the
#          ground the class names (047 D6). A soil zone of such a class is refused unless the
#          map's surfaces.yaml lists the class in `allow_unvalidated:`, and the world server
#          and `just surfaces-check` warn about it at every load.
#
# The friction and tire-curve values are the survey's literature table
# (survey-localized-deformable-terrain.md, wet and loose surfaces), not measurements; the soil
# rows are measured only where `calibration:` says so.
reference: asphalt

# Water film depth (m) a wetness implies where no zone or raster gives one.
wetness_depth:
  dry: 0.0
  moist: 0.0001
  wetWithPuddles: 0.0005
  lowFlooded: 0.003
  highFlooded: 0.010

# Hydroplaning (paved classes): Horne's onset speed for the tire pressure, 6.35 sqrt(p kPa)
# km/h, scaled by how much of the full film depth stands; grip falls from `onset` x that speed
# to `residual` at it. An engineering model, unvalidated.
hydroplaning:
  tire_pressure_kpa: 250.0
  onset: 0.5
  residual: 0.1
  depth_min: 0.0005
  depth_full: 0.0025

# Distance over which a wheel's friction follows a change of surface, m: about one contact
# patch, so a class edge is not a step ABS and traction control chatter on.
blend_length: 0.2

classes:
  asphalt:
    mu: 0.85
    sliding: 0.8
    relaxation: 0.5
    wet: {moist: 0.9, wetWithPuddles: 0.75, lowFlooded: 0.65, highFlooded: 0.55}
    hydroplaning: true
  concrete:
    mu: 0.8
    sliding: 0.8
    relaxation: 0.5
    wet: {moist: 0.9, wetWithPuddles: 0.75, lowFlooded: 0.65, highFlooded: 0.55}
    hydroplaning: true
  gravel:
    mu: 0.6
    peak_slip: 0.3
    peak_slip_angle: 12.0
    sliding: 0.9
    relaxation: 1.0
    wet: {moist: 0.95, wetWithPuddles: 0.9, lowFlooded: 0.85, highFlooded: 0.8}
  dirt:
    mu: 0.68
    peak_slip: 0.2
    peak_slip_angle: 10.0
    sliding: 0.85
    relaxation: 1.0
    wet: {moist: 0.85, wetWithPuddles: 0.7, lowFlooded: 0.6, highFlooded: 0.5}
    # sandy loam, 15 % moisture; janosi_k and slip_sinkage fitted in 047 S5 (as published:
    # K 0.025, slip sinkage 1)
    soil: {n: 0.7, k_c: 5270.0, k_phi: 1515040.0, cohesion: 1720.0, friction_angle: 29.0,
           janosi_k: 0.0375, slip_sinkage: 0.65}
    calibration: "none measured: Wong's sandy loam row, fitted to Chrono SCM (047 S5); no open
      road-tire test on a moist loam exists (053 step 2), the NG-NRMM CDT bevameter data next"
  grass:
    mu: 0.55
    peak_slip: 0.15
    peak_slip_angle: 9.0
    sliding: 0.75
    relaxation: 1.0
    wet: {moist: 0.8, wetWithPuddles: 0.6, lowFlooded: 0.5, highFlooded: 0.45}
  sand:
    # Dry loamy sand, driven on (cone index about 600 kPa). Measured: He 2020's Standard
    # Reference Test Tire, a 225/60R16 at 5 kN and 42 psi, the slip swept to 30 % (053 step 3:
    # drawbar pull within -9..+16 % of it past the peak, sinkage -22..+13 %). The friction
    # angle is the tire's on the sand, not the sand's own (about 33 deg): a rigid wheel in
    # Bekker-Janosi takes the soil's full shear, the tire does not. Slip sinkage: 2.5, the
    # least that holds the tolerance (the free fit's 3.9), and no more past 30 % slip, where
    # the measurement ends: carried on, a wheel spinning up from rest dug the car in (053).
    mu: 0.3
    peak_slip: 0.12
    peak_slip_angle: 14.0
    sliding: 0.95
    relaxation: 1.5
    wet: {moist: 1.1, wetWithPuddles: 1.0, lowFlooded: 0.9, highFlooded: 0.8}
    soil: {n: 1.12, k_c: 0.0, k_phi: 19500000.0, cohesion: 0.0, friction_angle: 16.4,
           janosi_k: 0.0047, slip_sinkage: 2.5, slip_sinkage_until: 0.3,
           rolling_resistance: 0.022}
    calibration: "He 2020 (Virginia Tech), SRTT 225/60R16 at 5 kN and 42 psi on dry loamy sand,
      medium compaction; spikes/references/he2020_srtt_medium.yaml"
  sand_loose:
    # The same sand freshly loosened (cone index about 245 kPa): a rear-drive car on it pulls
    # less than its front wheels resist, so it does not start from rest. Measured: He 2020's
    # SRTT on it, the slip to 72 % (053 step 3: drawbar pull within -22..+12 %, towed +10 %;
    # sinkage -26..+24 % to 27 %, the reference's rut a lower bound above). The two points
    # just outside: the peak at 11.5 % slip (ours 0.085 against 0.11, its error bar spans
    # 0.06-0.16) and the towed rut (deeper than at 10 % slip, which a Bekker wheel cannot be).
    mu: 0.26
    peak_slip: 0.12
    peak_slip_angle: 14.0
    sliding: 0.95
    relaxation: 1.5
    wet: {moist: 1.1, wetWithPuddles: 1.0, lowFlooded: 0.9, highFlooded: 0.8}
    soil: {n: 1.0, k_c: 0.0, k_phi: 6200000.0, cohesion: 0.0, friction_angle: 14.7,
           janosi_k: 0.007, slip_sinkage: 1.15, slip_sinkage_until: 0.72,
           rolling_resistance: 0.058}
    calibration: "He 2020 (Virginia Tech), SRTT 225/60R16 at 5 kN and 42 psi on dry loamy sand,
      low compaction; spikes/references/he2020_srtt_low.yaml"
  mud_wet:
    mu: 0.3
    peak_slip: 0.25
    peak_slip_angle: 12.0
    sliding: 0.64
    relaxation: 1.2
    # Wong's wettest clay row (clayey soil, Thailand, 55 % moisture), Janosi K at the soft
    # end of its range. No published real-time mud model exists (survey): no pore water, no
    # rate dependence, no clogging; the grid's slip sinkage is the only dig-in.
    soil: {n: 0.7, k_c: 16030.0, k_phi: 1262530.0, cohesion: 2070.0, friction_angle: 10.0,
           janosi_k: 0.025}
    unvalidated: "a wet clay row stands in for mud, nothing measured on mud backs it; 047 D6"
    calibration: "none measured: Wong's clayey soil at 55 % moisture; WES TR 3-666 Report 3
      (Wismer 1966, a 9.00-14 tire on wet fat clay) to obtain, 053 step 2"
  snow_packed:
    mu: 0.2
    peak_slip: 0.15
    peak_slip_angle: 6.0
    sliding: 0.8
    relaxation: 0.8
    wet: {moist: 0.8, wetWithPuddles: 0.6}
  snow_loose:
    mu: 0.25
    peak_slip: 0.3
    peak_slip_angle: 12.0
    sliding: 1.0
    relaxation: 1.5
    # snow (Wong's US snow)
    soil: {n: 1.6, k_c: 4370.0, k_phi: 196720.0, cohesion: 1030.0, friction_angle: 19.7,
           janosi_k: 0.04}
    calibration: "none measured: Wong's US snow row; Lee et al. 2012 (paywalled) or CRREL's
      reports (public, a browser fetches them) to obtain, 053 step 2"
    unvalidated: "Wong's US snow row with a typical Janosi K; no tire on snow checks it; 052 step 3, 053"
  ice:
    mu: 0.1
    peak_slip: 0.08
    peak_slip_angle: 3.0
    sliding: 0.6
    relaxation: 0.5
    stribeck: {speed: 3.0, sliding: 0.4}
    wet: {moist: 0.6, wetWithPuddles: 0.5}
